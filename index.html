<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sokol Haus Meister</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="building">
  <img src="assets/sokol-haus-meister.png" alt="Sokol Haus Meister">

  <button class="service s1" data-title="Hausmeister Service">Hausmeister Service</button>
  <button class="service s2" data-title="Möbel Demontage / Montage">Möbel Demontage / Montage</button>
  <button class="service s3" data-title="Sanitär Austausch / Reparatur">Sanitär Austausch / Reparatur</button>
  <button class="service s4" data-title="Wohnung renovieren">Wohnung renovieren</button>
  <button class="service s5" data-title="Demontage Fliesen, Tapete, Fußbodenbelag">Demontage Fliesen, Tapete, Fußbodenbelag</button>
  <button class="service s6" data-title="Entrümpelung Wohnung / Keller">Entrümpelung Wohnung / Keller</button>
</main>

<div class="modal" id="modal">
  <div class="card">
    <button class="close">&times;</button>
    <h2 id="title"></h2>
    <p>Hier wird später die Beschreibung des Bereichs mit zusätzlichen Leistungen und Bildern angezeigt.</p>
  </div>
</div>

<script>
const modal=document.getElementById("modal"), title=document.getElementById("title");
document.querySelectorAll(".service").forEach(b=>b.onclick=()=>{title.textContent=b.dataset.title;modal.classList.add("open")});
document.querySelector(".close").onclick=()=>modal.classList.remove("open");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
</script>
</body>
</html>
